services:
  backend:
    profiles: [app]
    build:
      context: .
      target: development
    command: npm run dev -w backend
    environment:
      # El .env local puede contener una URL hacia 127.0.0.1.
      # Dentro de Docker se usa el servicio db definido más abajo.
      DATABASE_URL: ""
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:5173}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - dependencias_node:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: [app]
    build:
      context: .
      target: development
    command: npm run dev -w frontend -- --host 0.0.0.0
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - dependencias_node:/app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: leetbattle
      POSTGRES_USER: leetbattle_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./db:/leetbattle/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  datos_postgres:
  dependencias_node:
